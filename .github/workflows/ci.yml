name: CI

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t adv-assistant:ci .

  publish-image:
    runs-on: ubuntu-latest
    needs: lint-test
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.STAGING_GCP_PROJECT_ID != '' && vars.PROD_GCP_PROJECT_ID != '' && vars.ARTIFACT_REGISTRY_REGION != '' && vars.ARTIFACT_REGISTRY_REPOSITORY != ''
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
      staging_image: ${{ steps.publish.outputs.staging_image }}
      prod_image: ${{ steps.publish.outputs.prod_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        env:
          AR_REGION: ${{ vars.ARTIFACT_REGISTRY_REGION }}
        run: gcloud auth configure-docker "$AR_REGION-docker.pkg.dev" --quiet

      - name: Build once and push immutable image tags
        id: publish
        env:
          AR_REGION: ${{ vars.ARTIFACT_REGISTRY_REGION }}
          AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          STAGING_PROJECT: ${{ vars.STAGING_GCP_PROJECT_ID }}
          PROD_PROJECT: ${{ vars.PROD_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          IMAGE_NAME="adv-assistant"
          IMAGE_TAG="${GITHUB_SHA}"

          STAGING_TAG="$AR_REGION-docker.pkg.dev/$STAGING_PROJECT/$AR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG"
          PROD_TAG="$AR_REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG"

          docker build -t "$STAGING_TAG" .
          docker tag "$STAGING_TAG" "$PROD_TAG"

          docker push "$STAGING_TAG"
          docker push "$PROD_TAG"

          STAGING_DIGEST="$(gcloud artifacts docker images describe "$STAGING_TAG" --project "$STAGING_PROJECT" --format='value(image_summary.digest)')"
          PROD_DIGEST="$(gcloud artifacts docker images describe "$PROD_TAG" --project "$PROD_PROJECT" --format='value(image_summary.digest)')"

          if [ -z "$STAGING_DIGEST" ] || [ -z "$PROD_DIGEST" ]; then
            echo "Failed to resolve pushed image digest."
            exit 1
          fi

          if [ "$STAGING_DIGEST" != "$PROD_DIGEST" ]; then
            echo "Digest mismatch between staging and prod pushes."
            echo "staging=$STAGING_DIGEST"
            echo "prod=$PROD_DIGEST"
            exit 1
          fi

          STAGING_IMAGE="$AR_REGION-docker.pkg.dev/$STAGING_PROJECT/$AR_REPOSITORY/$IMAGE_NAME@$STAGING_DIGEST"
          PROD_IMAGE="$AR_REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPOSITORY/$IMAGE_NAME@$PROD_DIGEST"

          {
            echo "image_digest=$STAGING_DIGEST"
            echo "image_tag=$IMAGE_TAG"
            echo "staging_image=$STAGING_IMAGE"
            echo "prod_image=$PROD_IMAGE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "tag=$IMAGE_TAG"
            echo "digest=$STAGING_DIGEST"
            echo "staging_image=$STAGING_IMAGE"
            echo "prod_image=$PROD_IMAGE"
          } > image-digests.txt

      - name: Upload digest manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.txt

  deploy-staging:
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/main' && vars.STAGING_GCP_PROJECT_ID != '' && vars.PROD_GCP_PROJECT_ID != '' && vars.ARTIFACT_REGISTRY_REGION != '' && vars.ARTIFACT_REGISTRY_REPOSITORY != '' && vars.STAGING_GCP_REGION != '' && vars.STAGING_CLOUD_RUN_SERVICE != ''
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (staging)
        env:
          STAGING_GCP_PROJECT_ID: ${{ vars.STAGING_GCP_PROJECT_ID }}
          STAGING_GCP_REGION: ${{ vars.STAGING_GCP_REGION }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.STAGING_CLOUD_RUN_SERVICE }}
          STAGING_CLOUD_RUN_ALLOW_UNAUTHENTICATED: ${{ vars.STAGING_CLOUD_RUN_ALLOW_UNAUTHENTICATED }}
          IMAGE_REF: ${{ needs.publish-image.outputs.staging_image }}
        run: |
          set -euo pipefail

          ALLOW_FLAG=""
          if [ "$STAGING_CLOUD_RUN_ALLOW_UNAUTHENTICATED" = "true" ]; then
            ALLOW_FLAG="--allow-unauthenticated"
          fi

          gcloud run deploy "$STAGING_CLOUD_RUN_SERVICE" \
            --project "$STAGING_GCP_PROJECT_ID" \
            --region "$STAGING_GCP_REGION" \
            --image "$IMAGE_REF" \
            $ALLOW_FLAG

  deploy-production:
    runs-on: ubuntu-latest
    needs: publish-image
    if: startsWith(github.ref, 'refs/tags/v') && vars.STAGING_GCP_PROJECT_ID != '' && vars.PROD_GCP_PROJECT_ID != '' && vars.ARTIFACT_REGISTRY_REGION != '' && vars.ARTIFACT_REGISTRY_REPOSITORY != '' && vars.PROD_GCP_REGION != '' && vars.PROD_CLOUD_RUN_SERVICE != ''
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (production)
        env:
          PROD_GCP_PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
          PROD_GCP_REGION: ${{ vars.PROD_GCP_REGION }}
          PROD_CLOUD_RUN_SERVICE: ${{ vars.PROD_CLOUD_RUN_SERVICE }}
          PROD_CLOUD_RUN_ALLOW_UNAUTHENTICATED: ${{ vars.PROD_CLOUD_RUN_ALLOW_UNAUTHENTICATED }}
          IMAGE_REF: ${{ needs.publish-image.outputs.prod_image }}
        run: |
          set -euo pipefail

          ALLOW_FLAG=""
          if [ "$PROD_CLOUD_RUN_ALLOW_UNAUTHENTICATED" = "true" ]; then
            ALLOW_FLAG="--allow-unauthenticated"
          fi

          gcloud run deploy "$PROD_CLOUD_RUN_SERVICE" \
            --project "$PROD_GCP_PROJECT_ID" \
            --region "$PROD_GCP_REGION" \
            --image "$IMAGE_REF" \
            $ALLOW_FLAG
