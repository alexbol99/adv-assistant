[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adv-assistant"
version = "0.1.0"
description = "WhatsApp Advertisement Assistant Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.15.0,<1.0.0",
  "pre-commit>=4.3.0,<5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/adv_assistant"]
