services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: adv_assistant
      POSTGRES_USER: adv_assistant
      POSTGRES_PASSWORD: adv_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
